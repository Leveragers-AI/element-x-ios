name: Leveragers TestFlight

# Leveragers fork only: builds "Agents by Leveragers" on GitHub's macOS runner and uploads it to
# TestFlight (Apple team FVBUM2YL8B). Element's own workflows are removed from this branch.
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (App Store Connect API key),
#          SIGNING_DEV_P12_BASE64, SIGNING_DIST_P12_BASE64, SIGNING_P12_PASSWORD (certificates
#          created through the API from hub2; private keys kept on hub2 only, in config/).
on:
  workflow_dispatch:
  push:
    branches: [leveragers]
    paths-ignore:
      - "LEVERAGERS.md"

concurrency:
  group: leveragers-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    name: Build and upload to TestFlight
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      TEAM_ID: FVBUM2YL8B
      BUILD_NUMBER: ${{ github.run_number }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Check configuration
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SIGNING_DEV_P12_BASE64: ${{ secrets.SIGNING_DEV_P12_BASE64 }}
          SIGNING_DIST_P12_BASE64: ${{ secrets.SIGNING_DIST_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 SIGNING_DEV_P12_BASE64 SIGNING_DIST_P12_BASE64 SIGNING_P12_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
          brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen

      - name: Install the App Store Connect key and the signing certificates
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SIGNING_DEV_P12_BASE64: ${{ secrets.SIGNING_DEV_P12_BASE64 }}
          SIGNING_DIST_P12_BASE64: ${{ secrets.SIGNING_DIST_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          key="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$keychain" -T /usr/bin/codesign || true
          for kind in DEV DIST; do
            var="SIGNING_${kind}_P12_BASE64"
            printf '%s' "${!var}" | base64 --decode > "$RUNNER_TEMP/$kind.p12"
            security import "$RUNNER_TEMP/$kind.p12" -k "$keychain" -P "$SIGNING_P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
            rm -f "$RUNNER_TEMP/$kind.p12"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ElementX.xcodeproj \
            -scheme ElementX \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Agents.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -quiet \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN"

      - name: Export and upload to TestFlight
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Agents.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" || {
            mkdir -p "$RUNNER_TEMP/export-logs"
            find "${TMPDIR:-/tmp}" -maxdepth 3 -name '*.xcdistributionlogs' -exec cp -R {} "$RUNNER_TEMP/export-logs/" \; 2>/dev/null
            exit 1
          }

      - name: Keep the export logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: export-logs
          path: |
            ${{ runner.temp }}/export
            ${{ runner.temp }}/export-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove the signing material
        if: always()
        run: |
          [ -n "${SIGNING_KEYCHAIN:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -f "${ASC_KEY_PATH:-/nonexistent}"
