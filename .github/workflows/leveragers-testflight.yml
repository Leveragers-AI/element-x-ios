name: Leveragers TestFlight

# Leveragers fork only: builds "Agents by Leveragers" on GitHub's macOS runner and uploads it to
# TestFlight (Apple team FVBUM2YL8B). Element's own workflows are removed from this branch.
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (App Store Connect API key),
#          SIGNING_DIST_P12_BASE64, SIGNING_P12_PASSWORD (Apple Distribution certificate created through
#          the API from hub2; private key kept on hub2 only, in config/),
#          PROFILE_APP_BASE64, PROFILE_NSE_BASE64, PROFILE_SHARE_BASE64 (App Store provisioning profiles
#          created through the API). Signing is manual: xcodebuild's own sign-in with the API key was
#          refused (401) on the first run, the standard API calls with the same key work.
on:
  workflow_dispatch:
  push:
    branches: [leveragers]
    paths-ignore:
      - "LEVERAGERS.md"

concurrency:
  group: leveragers-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    name: Build and upload to TestFlight
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      TEAM_ID: FVBUM2YL8B
      BUILD_NUMBER: ${{ github.run_number }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Check configuration
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SIGNING_DIST_P12_BASE64: ${{ secrets.SIGNING_DIST_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
          PROFILE_APP_BASE64: ${{ secrets.PROFILE_APP_BASE64 }}
          PROFILE_NSE_BASE64: ${{ secrets.PROFILE_NSE_BASE64 }}
          PROFILE_SHARE_BASE64: ${{ secrets.PROFILE_SHARE_BASE64 }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 SIGNING_DIST_P12_BASE64 SIGNING_P12_PASSWORD PROFILE_APP_BASE64 PROFILE_NSE_BASE64 PROFILE_SHARE_BASE64; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
          brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen

      # Xcode's compilation cache (as Element's own CI does) and the Swift packages, kept between
      # runs: a fresh checkout invalidates DerivedData, these two survive it.
      - name: Restore the build caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Developer/Xcode/CompilationCache.noindex
            ~/SourcePackages
          key: testflight-build-cache-${{ github.sha }}
          restore-keys: testflight-build-cache-

      - name: Install the App Store Connect key, the certificate and the profiles
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SIGNING_DIST_P12_BASE64: ${{ secrets.SIGNING_DIST_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
          PROFILE_APP_BASE64: ${{ secrets.PROFILE_APP_BASE64 }}
          PROFILE_NSE_BASE64: ${{ secrets.PROFILE_NSE_BASE64 }}
          PROFILE_SHARE_BASE64: ${{ secrets.PROFILE_SHARE_BASE64 }}
        run: |
          # altool and Transporter look for the key in ~/.appstoreconnect/private_keys.
          mkdir -p ~/.appstoreconnect/private_keys
          key="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$keychain" -T /usr/bin/codesign || true
          printf '%s' "$SIGNING_DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$SIGNING_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            for var in PROFILE_APP_BASE64 PROFILE_NSE_BASE64 PROFILE_SHARE_BASE64; do
              file="$RUNNER_TEMP/profile.mobileprovision"
              printf '%s' "${!var}" | base64 --decode > "$file"
              uuid=$(security cms -D -i "$file" | plutil -extract UUID raw -o - -)
              name=$(security cms -D -i "$file" | plutil -extract Name raw -o - -)
              cp "$file" "$dir/$uuid.mobileprovision"
              echo "profile $name ($uuid)"
            done
          done
          rm -f "$RUNNER_TEMP/profile.mobileprovision"

      - name: Check the App Store Connect key against the API
        run: |
          python3 -m venv "$RUNNER_TEMP/jwt-venv"
          "$RUNNER_TEMP/jwt-venv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/jwt-venv/bin/python" - <<'PY'
          import os, time, urllib.request, jwt
          now = int(time.time())
          token = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
                             open(os.environ["ASC_KEY_PATH"]).read(), algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"]})
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps/6838343028?fields[apps]=bundleId",
                                       headers={"Authorization": "Bearer " + token})
          with urllib.request.urlopen(req, timeout=60) as r:
              print("App Store Connect API:", r.status)
          PY

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ElementX.xcodeproj \
            -scheme ElementX \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Agents.xcarchive" \
            -clonedSourcePackagesDirPath "$HOME/SourcePackages" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -quiet \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_CAS_PATH="$HOME/Library/Developer/Xcode/CompilationCache.noindex" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN"

      # Saved after a successful archive only. The cache grows with every change it absorbs:
      # past 6 GB it is dropped so the next run starts cold (GitHub allows 10 GB per repository).
      - name: Trim the build caches
        run: |
          size=$(du -sm ~/Library/Developer/Xcode/CompilationCache.noindex 2>/dev/null | cut -f1)
          echo "compilation cache: ${size:-0} MB, packages: $(du -sm ~/SourcePackages 2>/dev/null | cut -f1) MB"
          if [ "${size:-0}" -gt 6000 ]; then rm -rf ~/Library/Developer/Xcode/CompilationCache.noindex; echo "compilation cache dropped"; fi

      - name: Save the build caches
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Developer/Xcode/CompilationCache.noindex
            ~/SourcePackages
          key: testflight-build-cache-${{ github.sha }}

      - name: Export the signed app
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.leveragers.agents</key><string>Agents by Leveragers App Store</string>
              <key>com.leveragers.agents.nse</key><string>Agents by Leveragers NSE App Store</string>
              <key>com.leveragers.agents.shareextension</key><string>Agents by Leveragers Share App Store</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Agents.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" || {
            mkdir -p "$RUNNER_TEMP/export-logs"
            find "${TMPDIR:-/tmp}" -maxdepth 3 -name '*.xcdistributionlogs' -exec cp -R {} "$RUNNER_TEMP/export-logs/" \; 2>/dev/null
            exit 1
          }
          ls -la "$RUNNER_TEMP/export"

      - name: Keep the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agents-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 7

      - name: Upload to TestFlight
        run: |
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          if xcrun --find altool > /dev/null 2>&1; then
            xcrun altool --upload-app -f "$ipa" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal
          else
            xcrun iTMSTransporter -m upload -assetFile "$ipa" -apiKey "$ASC_KEY_ID" -apiIssuer "$ASC_ISSUER_ID" -v informational
          fi

      - name: Keep the export logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: export-logs
          path: |
            ${{ runner.temp }}/export
            ${{ runner.temp }}/export-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove the signing material
        if: always()
        run: |
          [ -n "${SIGNING_KEYCHAIN:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -f "${ASC_KEY_PATH:-/nonexistent}"
